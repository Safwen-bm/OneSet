services:
  db:
    image: postgres:16-alpine
    container_name: oneset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneset
      POSTGRES_PASSWORD: oneset
      POSTGRES_DB: oneset
    ports:
      - '5432:5432'
    volumes:
      - oneset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oneset']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: oneset-adminer
    restart: unless-stopped
    ports:
      - '8081:8080'
    depends_on:
      - db

volumes:
  oneset-db-data:
